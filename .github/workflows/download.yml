name: TG Action Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Direct download URL"
        required: true
        type: string
      part_size:
        description: "Part size in MB"
        required: true
        default: "50"
        type: string
      connections:
        description: "Download connections"
        required: true
        default: "16"
        type: string

jobs:
  download:
    name: Download and Split
    runs-on: ubuntu-latest

    steps:
      - name: Install aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Show settings
        run: |
          echo "TG ACTION DOWNLOADER"
          echo "URL: ${{ inputs.url }}"
          echo "PART SIZE: ${{ inputs.part_size }} MB"
          echo "CONNECTIONS: ${{ inputs.connections }}"

      - name: Download
        shell: bash
        run: |
          set -e

          mkdir -p download

          aria2c \
            --continue=true \
            --max-connection-per-server="${{ inputs.connections }}" \
            --split="${{ inputs.connections }}" \
            --min-split-size=1M \
            --max-tries=10 \
            --retry-wait=5 \
            --timeout=30 \
            --connect-timeout=30 \
            --summary-interval=5 \
            --file-allocation=none \
            --allow-overwrite=true \
            --dir=download \
            "${{ inputs.url }}"

      - name: Find file
        shell: bash
        run: |
          set -e

          FILE=$(find download -type f ! -name "*.aria2" | head -n 1)

          if [ -z "$FILE" ]; then
            echo "No downloaded file found."
            exit 1
          fi

          FILE_NAME=$(basename "$FILE")
          FILE_SIZE=$(stat -c%s "$FILE")

          echo "FILE=$FILE" >> "$GITHUB_ENV"
          echo "FILE_NAME=$FILE_NAME" >> "$GITHUB_ENV"
          echo "FILE_SIZE=$FILE_SIZE" >> "$GITHUB_ENV"

          echo "File: $FILE_NAME"
          echo "Size: $FILE_SIZE bytes"
          du -h "$FILE"

      - name: Create downloads folder
        run: |
          mkdir -p downloads/parts

      - name: Copy original file
        run: |
          cp -- "$FILE" "downloads/$FILE_NAME"

      - name: Split file
        shell: bash
        run: |
          set -e

          split \
            -b "${{ inputs.part_size }}M" \
            -d \
            -a 4 \
            "$FILE" \
            "downloads/parts/part-"

      - name: Rename parts
        shell: bash
        run: |
          set -e

          cd downloads/parts

          i=1

          for file in part-*; do
            [ -f "$file" ] || continue

            newname=$(printf "part-%04d" "$i")
            mv -- "$file" "$newname"

            i=$((i + 1))
          done

          cd ..

          echo "Parts:"
          find parts -type f -printf "%f %s bytes\n"

      - name: Generate hashes
        shell: bash
        run: |
          set -e

          sha256sum "downloads/$FILE_NAME" \
            > "downloads/original.sha256"

          cd downloads/parts
          sha256sum * > ../parts.sha256
          cd ..

          echo "Original SHA256:"
          cat original.sha256

      - name: Generate manifest
        shell: bash
        run: |
          set -e

          PART_COUNT=$(find downloads/parts -type f | wc -l)
          ORIGINAL_SHA256=$(awk '{print $1}' downloads/original.sha256)
          HUMAN_SIZE=$(du -h "$FILE" | cut -f1)

          {
            echo "TG ACTION DOWNLOADER"
            echo "===================="
            echo ""
            echo "File:"
            echo "$FILE_NAME"
            echo ""
            echo "Size:"
            echo "$FILE_SIZE bytes"
            echo ""
            echo "Human Size:"
            echo "$HUMAN_SIZE"
            echo ""
            echo "Parts:"
            echo "$PART_COUNT"
            echo ""
            echo "Part Size:"
            echo "${{ inputs.part_size }} MB"
            echo ""
            echo "Connections:"
            echo "${{ inputs.connections }}"
            echo ""
            echo "Original SHA256:"
            echo "$ORIGINAL_SHA256"
            echo ""
            echo "Generated:"
            date -u +"%Y-%m-%d %H:%M:%S UTC"
          } > downloads/manifest.txt

          cat downloads/manifest.txt

      - name: Show final structure
        run: |
          echo "FINAL WORKSPACE STRUCTURE"
          echo "========================="

          find downloads -type f -printf "%p - %s bytes\n" | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: downloaded-files
          path: downloads/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
