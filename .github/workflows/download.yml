name: TG Action Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Direct download URL"
        required: true
        type: string

      part_size:
        description: "Part size in MB"
        required: false
        default: "500"
        type: string

      connections:
        description: "Number of download connections"
        required: false
        default: "16"
        type: string

jobs:
  download:
    name: Download and Split
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Show settings
        run: |
          echo "================================"
          echo " TG ACTION DOWNLOADER"
          echo "================================"
          echo "URL: ${{ inputs.url }}"
          echo "Part Size: ${{ inputs.part_size }} MB"
          echo "Connections: ${{ inputs.connections }}"
          echo "================================"

      - name: Download file
        shell: bash
        run: |
          set -e

          mkdir -p download

          aria2c \
            --continue=true \
            --max-connection-per-server="${{ inputs.connections }}" \
            --split="${{ inputs.connections }}" \
            --min-split-size=1M \
            --max-tries=10 \
            --retry-wait=5 \
            --timeout=30 \
            --connect-timeout=30 \
            --summary-interval=5 \
            --file-allocation=none \
            --allow-overwrite=true \
            --dir=download \
            "${{ inputs.url }}"

      - name: Find downloaded file
        shell: bash
        run: |
          set -e

          FILE=$(find download -type f ! -name '*.aria2' | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: No downloaded file found."
            exit 1
          fi

          FILE_NAME=$(basename "$FILE")
          FILE_SIZE=$(stat -c%s "$FILE")

          echo "================================"
          echo "DOWNLOAD COMPLETE"
          echo "================================"
          echo "File: $FILE_NAME"
          echo "Size: $FILE_SIZE bytes"
          echo "Size: $(du -h "$FILE" | cut -f1)"
          echo "================================"

          echo "FILE=$FILE" >> "$GITHUB_ENV"
          echo "FILE_NAME=$FILE_NAME" >> "$GITHUB_ENV"
          echo "FILE_SIZE=$FILE_SIZE" >> "$GITHUB_ENV"

      - name: Prepare file structure
        shell: bash
        run: |
          set -e

          mkdir -p artifact/file
          mkdir -p artifact/file/parts

          # Keep the original file completely untouched.
          cp -- "$FILE" "artifact/file/$FILE_NAME"

      - name: Split file
        shell: bash
        run: |
          set -e

          PART_SIZE="${{ inputs.part_size }}M"

          echo "================================"
          echo "SPLITTING"
          echo "================================"
          echo "Source: $FILE"
          echo "Part size: $PART_SIZE"
          echo "================================"

          split \
            -b "$PART_SIZE" \
            -d \
            -a 4 \
            "$FILE" \
            "artifact/file/parts/part-"

      - name: Rename parts
        shell: bash
        run: |
          set -e

          cd artifact/file/parts

          i=1

          for file in part-*; do
            [ -f "$file" ] || continue

            printf -v newname "part-%04d" "$i"

            mv -- "$file" "$newname"

            i=$((i + 1))
          done

          cd ../../..

          echo "================================"
          echo "PARTS CREATED"
          echo "================================"

          find artifact/file/parts \
            -type f \
            -printf '%f %s bytes\n' \
            | sort

      - name: Generate SHA256
        shell: bash
        run: |
          set -e

          sha256sum \
            "artifact/file/$FILE_NAME" \
            > artifact/file/original.sha256

          (
            cd artifact/file/parts
            sha256sum *
          ) > artifact/file/parts.sha256

          echo "Original SHA256:"
          cat artifact/file/original.sha256

      - name: Generate manifest
        shell: bash
        run: |
          set -e

          PART_COUNT=$(find artifact/file/parts -type f | wc -l)

          PART_SIZE="${{ inputs.part_size }} MB"

          ORIGINAL_SHA256=$(awk '{print $1}' artifact/file/original.sha256)

          cat > artifact/file/manifest.txt <<EOF
TG ACTION DOWNLOADER
====================

File:
$FILE_NAME

Size:
$FILE_SIZE bytes

Human Size:
$(numfmt --to=iec "$FILE_SIZE")

Parts:
$PART_COUNT

Part Size:
$PART_SIZE

Original SHA256:
$ORIGINAL_SHA256

Generated:
$(date -u +"%Y-%m-%d %H:%M:%S UTC")
EOF

          echo "================================"
          cat artifact/file/manifest.txt
          echo "================================"

      - name: Show final structure
        shell: bash
        run: |
          echo "================================"
          echo "FINAL ARTIFACT"
          echo "================================"

          find artifact -type f -printf '%p - %s bytes\n' | sort

          echo "================================"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: downloaded-files
          path: artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
